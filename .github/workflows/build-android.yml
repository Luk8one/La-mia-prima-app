
name: Crea APK Android

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compila Quaderno
    runs-on: ubuntu-24.04

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa dipendenze Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Installa Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Installa Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.37


      - name: Configura Android SDK

        uses: android-actions/setup-android@v4
        with:
          packages: ''

        

      - name: Accetta licenze e installa Build-Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROIDSDK=$ANDROID_HOME" >> $GITHUB_ENV


      - name: Compila APK
        run: buildozer -v android debug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: Quaderno-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
