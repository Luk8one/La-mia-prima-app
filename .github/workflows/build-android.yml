
name: Crea APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compila Quaderno
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Compila l'app Android
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Salva il file APK
        uses: actions/upload-artifact@v4
        with:
          name: Quaderno-APK
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error
          retention-days: 7
